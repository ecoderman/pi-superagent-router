name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Full suite: type stripping for .ts files needs Node >= 22.6.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test

  # The extension itself loads through pi's TypeScript loader, so Node 20 only
  # needs to prove the sources still typecheck.
  typecheck-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
